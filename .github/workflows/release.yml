name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
            platform: macos
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
            platform: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build Tauri application
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Collect Windows packages
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $release = "src-tauri/target/${{ matrix.target }}/release"
          Copy-Item "$release/st-helper.exe" "dist-release/ST-Helper.exe"
          Copy-Item "$release/bundle/msi/*.msi" "dist-release/"
          Copy-Item "$release/bundle/nsis/*.exe" "dist-release/"

      - name: Collect macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p dist-release
          dmg="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "dist-release/ST-Helper-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "ST Helper $GITHUB_REF_NAME" --generate-notes
