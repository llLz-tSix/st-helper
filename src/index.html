<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ST Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="bar" data-tauri-drag-region>
      <span id="dot" data-tauri-drag-region></span>
      <span id="status" data-tauri-drag-region>Запуск…</span>
      <span id="mode" data-tauri-drag-region></span>
      <button id="btn-pause" title="Пауза (Ctrl+Shift+P)">❚❚</button>
      <button id="btn-settings" title="Настройки (Ctrl+Shift+S)">⚙</button>
      <button id="btn-hide" title="Скрыть (Ctrl+Shift+H)">✕</button>
    </div>
    <div id="question"></div>
    <div id="answer"><span class="hint">Ожидаю вопрос…</span></div>
    <div id="grip" title="Изменить размер"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
